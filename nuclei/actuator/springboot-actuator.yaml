id: springboot-actuator

info:
  severity: info
  name: Detect Springboot Actuators
  author: custom
  metadata:
    max-request: 4
    shodan-query: http.favicon.hash:116323821
  tags: tech,springboot,actuator,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/actuator"
      - "{{BaseURL}}actuator/env"
      - "{{BaseURL}}/actuator/health"
      - "{{BaseURL}}/actuator/beans"
      - "{{BaseURL}}/actuator/mappings"
      - "{{BaseURL}}/actuator/configprops"     
    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
          - 503
      - type: regex
        part: body
        regex:
          - '"_links"\s*:\s*\{'
          - '"status"\s*:\s*"(?:UP|DOWN|OUT_OF_SERVICE|UNKNOWN)"'
          - '"(?:propertySources|activeProfiles|systemProperties|systemEnvironment)"\s*:'
          - '"(?:beans|contexts)"\s*:'
          - '"(?:configurationProperties|prefix)"\s*:'
          - '"names"\s*:\s*\['
          - '"(?:mappings|dispatcherServlets|dispatcherHandlers|servletFilters)"\s*:'
          - '"(?:loggers|levels)"\s*:'
          - '"(?:threads|threadName|lockedMonitors)"\s*:'
          - '"(?:exchanges|traces)"\s*:\s*\['
          - '"(?:sessions|attributeNames|lastAccessedTime|maxInactiveInterval)"\s*:'
          - '"(?:bomFormat|SPDXID)"\s*:'
          - '"request"\s*:\s*\{\s*"type"\s*:\s*"version"'
          - '(?m)^# (?:HELP|TYPE) [a-zA-Z_:][a-zA-Z0-9_:]*'
    extractors:
      - type: json
        name: available-endpoints
        json:
          - .[] | to_entries | .[].key
